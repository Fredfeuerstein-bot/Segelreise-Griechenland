<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#Sail,climbe,sleep,(rep)eat</title>

<style>
body{
  font-family:monospace;
  margin:40px;
  line-height:1.6;
  background:white;
  color:black;
  min-height:2500px;
  overflow-x:hidden
}

h1{
  background:#0033cc;
  color:#ffff00;
  padding:20px
}

a{
  display:inline-block;
  margin:15px 0;
  background:yellow;
  color:black;
  padding:10px 20px;
  border:2px solid black;
  text-decoration:none
}

section{
  margin:60px 0
}

img,video,audio{
  display:block;
  max-width:100%;
  height:auto;
  margin:20px 0
}

audio{
  width:100%
}

#boat{
  position:fixed;
  bottom:35px;
  left:-220px;
  width:220px;
  height:150px;
  z-index:1000;
  animation:
    sail 22s linear infinite alternate,
    bob 2.2s ease-in-out infinite
}

#boat svg{
  width:100%;
  height:100%
}

#boat line,
#boat polyline,
#boat polygon{
  stroke:black;
  stroke-width:2;
  fill:none
}

@keyframes sail{
  from{left:-220px}
  to{left:calc(100% - 220px)}
}

@keyframes bob{
  0%{
    transform:translateY(0) rotate(-2deg)
  }
  50%{
    transform:translateY(-8px) rotate(2deg)
  }
  100%{
    transform:translateY(0) rotate(-2deg)
  }
}

#waves{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  font-size:28px;
  line-height:22px;
  white-space:nowrap;
  pointer-events:none
}
</style>
</head>

<body>

<h1>&lt;3Home is where we drop our Anchor&lt;3</h1>

<h2>
Falls du schauen möchtest wo wir sind dann drücke diesen Knopf!
Aber nicht zu fest sonst geht dein Display in den Arsch!!!
</h2>

<a
  href="https://www.marinetraffic.com/en/ais/home/shipid:7710209/zoom:14"
  target="_blank"
>
  Hier sind wir
</a>

<div id="tage"></div>

<div id="boat">
<svg viewBox="0 0 220 150">
  <polyline points="25,45 75,120 145,120 195,45"/>
  <line x1="75" y1="120" x2="145" y2="120"/>
  <line x1="25" y1="45" x2="110" y2="82"/>
  <line x1="195" y1="45" x2="110" y2="82"/>
  <line x1="75" y1="120" x2="110" y2="82"/>
  <line x1="145" y1="120" x2="110" y2="82"/>
  <polygon points="80,60 110,20 140,60"/>
  <line x1="110" y1="20" x2="110" y2="82"/>
  <line x1="80" y1="60" x2="52" y2="52"/>
  <line x1="140" y1="60" x2="168" y2="52"/>
</svg>
</div>

<div id="waves">
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
</div>


<script>

const user = "Fredfeuerstein-bot";
const repo = "Segelreise-Griechenland";
const branch = "main";

const apiURL =
  `https://api.github.com/repos/${user}/${repo}/git/trees/${branch}?recursive=1`;

const rawURL =
  `https://raw.githubusercontent.com/${user}/${repo}/${branch}/`;


async function lade(){

  const container = document.getElementById("tage");

  try{

    // Alle Dateien des gesamten Repositorys in EINEM Aufruf laden
    const response = await fetch(apiURL);

    if(!response.ok){
      throw new Error("GitHub API Fehler: " + response.status);
    }

    const data = await response.json();

    if(!data.tree){
      throw new Error("Keine Dateien gefunden");
    }

    const tage = {};

    // Dateien nach Tagesordner sortieren
    for(const file of data.tree){

      if(file.type !== "blob") continue;

      const teile = file.path.split("/");

      // Wir brauchen mindestens:
      // Ordner/Datei
      if(teile.length < 2) continue;

      const ordner = teile[0];

      // Nur nummerierte Tagesordner verwenden
      if(!/^\d+$/.test(ordner)) continue;

      const nr = Number(ordner);

      if(!tage[nr]){
        tage[nr] = {
          text:"",
          media:[]
        };
      }

      const dateiname = teile[teile.length - 1];
      const name = dateiname.toLowerCase();

      const url = rawURL + file.path
        .split("/")
        .map(encodeURIComponent)
        .join("/");

      // TXT
      if(name.endsWith(".txt")){

        try{
          const textResponse = await fetch(url);
          tage[nr].text = await textResponse.text();
        }catch(e){
          console.error("TXT konnte nicht geladen werden:", file.path);
        }

        continue;
      }

      // Medien
      let typ = null;

      if(name.endsWith(".jpg")) typ = "jpg";
      else if(name.endsWith(".jpeg")) typ = "jpeg";
      else if(name.endsWith(".png")) typ = "png";
      else if(name.endsWith(".gif")) typ = "gif";
      else if(name.endsWith(".webp")) typ = "webp";
      else if(name.endsWith(".mp4")) typ = "mp4";
      else if(name.endsWith(".mp3")) typ = "mp3";

      if(typ){

        tage[nr].media.push({
          name:dateiname,
          url:url,
          typ:typ
        });

      }

    }


    // Medien alphabetisch sortieren
    Object.values(tage).forEach(tag => {

      tag.media.sort((a,b) =>
        a.name.localeCompare(
          b.name,
          undefined,
          {numeric:true}
        )
      );

    });


    // Tage anzeigen
    Object.keys(tage)
      .map(Number)
      .sort((a,b)=>b-a)
      .forEach(nr => {

        const s = document.createElement("section");

        const h = document.createElement("h2");
        h.textContent = "Tag " + nr;

        s.appendChild(h);


        // Text
        if(tage[nr].text.trim()){

          const p = document.createElement("p");

          p.textContent = tage[nr].text;

          s.appendChild(p);

        }


        // Medien
        tage[nr].media.forEach(m => {

          if(m.typ === "mp4"){

            const v = document.createElement("video");

            v.src = m.url;
            v.controls = true;
            v.playsInline = true;

            s.appendChild(v);

          }

          else if(m.typ === "mp3"){

            const a = document.createElement("audio");

            a.src = m.url;
            a.controls = true;

            s.appendChild(a);

          }

          else{

            const i = document.createElement("img");

            i.src = m.url;
            i.alt = m.name;

            s.appendChild(i);

          }

        });


        container.appendChild(s);

      });

  }

  catch(error){

    console.error(error);

    const fehler = document.createElement("p");

    fehler.textContent =
      "Die Medien konnten leider nicht geladen werden. " +
      "Bitte später nochmals versuchen.";

    container.appendChild(fehler);

  }

}


lade();

</script>

</body>
</html>
