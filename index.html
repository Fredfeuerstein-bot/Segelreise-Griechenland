<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#Sail,climbe,sleep,(rep)eat</title>
<style>
body{font-family:monospace;margin:40px;line-height:1.6;background:white;color:black;min-height:2500px;overflow-x:hidden}
h1{background:#0033cc;color:#ffff00;padding:20px}
a{display:inline-block;margin:15px 0;background:yellow;color:black;padding:10px 20px;border:2px solid black;text-decoration:none}
section{margin:60px 0}
img,video,audio{display:block;max-width:100%;height:auto;margin:20px 0}
audio{width:100%}
#boat{position:fixed;bottom:35px;left:-220px;width:220px;height:150px;z-index:1000;animation:sail 22s linear infinite alternate,bob 2.2s ease-in-out infinite}
#boat svg{width:100%;height:100%}
#boat line,#boat polyline,#boat polygon{stroke:black;stroke-width:2;fill:none}
@keyframes sail{from{left:-220px}to{left:calc(100% - 220px)}}
@keyframes bob{0%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}100%{transform:translateY(0) rotate(-2deg)}}
#waves{position:fixed;left:0;bottom:0;width:100%;font-size:28px;line-height:22px;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>

<h1>&lt;3Home is where we drop our Anchor&lt;3</h1>
<h2>Falls du schauen möchtest wo wir sind dann drücke diesen Knopf! Aber nicht zu fest sonst geht dein Display in den Arsch!!!</h2>

<a href="https://www.marinetraffic.com/en/ais/home/shipid:7710209/zoom:14" target="_blank">Hier sind wir</a>

<div id="tage"></div>

<div id="boat"><svg viewBox="0 0 220 150"><polyline points="25,45 75,120 145,120 195,45"/><line x1="75" y1="120" x2="145" y2="120"/><line x1="25" y1="45" x2="110" y2="82"/><line x1="195" y1="45" x2="110" y2="82"/><line x1="75" y1="120" x2="110" y2="82"/><line x1="145" y1="120" x2="110" y2="82"/><polygon points="80,60 110,20 140,60"/><line x1="110" y1="20" x2="110" y2="82"/><line x1="80" y1="60" x2="52" y2="52"/><line x1="140" y1="60" x2="168" y2="52"/></svg></div>

<div id="waves">~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~</div>

<script>
const user="Fredfeuerstein-bot";
const repo="Segelreise-Griechenland";

async function lade(){

const tage={};

const root=await fetch(`https://api.github.com/repos/${user}/${repo}/contents`)
.then(r=>r.json()).catch(()=>[]);

for(const folder of root){

 if(folder.type!=="dir") continue;
 if(!/^\d+$/.test(folder.name)) continue;

 const nr=Number(folder.name);
 tage[nr]={text:"",media:[]};

 const files=await fetch(folder.url).then(r=>r.json()).catch(()=>[]);

 for(const file of files){

   if(file.type!=="file") continue;

   const name=file.name.toLowerCase();

   if(name.endsWith(".txt")){
      tage[nr].text=await fetch(file.download_url).then(r=>r.text()).catch(()=> "");
      continue;
   }

   const ext=name.split(".").pop();

   if(["jpg","jpeg","png","gif","webp","mp4","mp3"].includes(ext)){
      tage[nr].media.push({
        name:file.name,
        url:file.download_url,
        typ:ext
      });
   }
 }

 tage[nr].media.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
}

const container=document.getElementById("tage");

Object.keys(tage).map(Number).sort((a,b)=>b-a).forEach(nr=>{

 const s=document.createElement("section");
 const h=document.createElement("h2");
 h.textContent="Tag "+nr;
 s.appendChild(h);

 if(tage[nr].text.trim()){
   const p=document.createElement("p");
   p.textContent=tage[nr].text;
   s.appendChild(p);
 }

 tage[nr].media.forEach(m=>{
   if(m.typ==="mp4"){
      const v=document.createElement("video");
      v.src=m.url;
      v.controls=true;
      s.appendChild(v);
   }else if(m.typ==="mp3"){
      const a=document.createElement("audio");
      a.src=m.url;
      a.controls=true;
      s.appendChild(a);
   }else{
      const i=document.createElement("img");
      i.src=m.url;
      i.alt=m.name;
      s.appendChild(i);
   }
 });

 container.appendChild(s);
});

}

lade();
</script>

</body>
</html>
